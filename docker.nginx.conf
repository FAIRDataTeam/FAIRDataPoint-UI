# Configures Nginx as a static file server.
# Config based on example from https://docs.docker.com/guides/vuejs/

worker_processes auto;  # Automatically set the number of worker processes based on available CPU cores
pid /tmp/nginx.pid;  # Store the master process ID file in /tmp (useful for non-root/rootless containers)

events {
    worker_connections 1024;  # Maximum number of simultaneous connections each worker can handle
}

http {
    include       /etc/nginx/mime.types;  # Include the standard MIME type mappings for file extensions
    default_type  application/octet-stream;  # Default MIME type used when a file's type cannot be determined
    charset       utf-8;  # Set UTF-8 as the default character encoding for responses

    # https://docs.nginx.com/nginx/admin-guide/monitoring/logging/
    access_log    off;  # Disable the access log globally to reduce disk I/O
    error_log     /dev/stderr warn;  # Send error logs to stderr (container-friendly) at "warn" level or higher

    # https://nginx.org/en/docs/http/ngx_http_core_module.html
    sendfile        on;  # Enable the efficient sendfile() system call for serving static files
    tcp_nopush      on;  # Optimize packet transmission for sendfile by delaying sends until larger packets can be formed
    tcp_nodelay     on;  # Reduce latency on keep-alive connections
    keepalive_timeout  65;  # Keep idle client connections open for up to 65 seconds
    keepalive_requests 1000;  # Allow up to 1000 requests per keep-alive connection before closing it

    # https://nginx.org/en/docs/http/ngx_http_gzip_module.html
    gzip on;  # Enable gzip compression of responses
    gzip_comp_level 6;  # Compression level (1=fastest, 9=best); 6 is a balanced default
    gzip_proxied any;  # Compress responses for all proxied requests regardless of headers
    gzip_min_length 256;  # Only compress responses with "Content-Length" larger than 256 bytes (smaller ones aren't worth it)
    gzip_vary on;  # Add "Vary: Accept-Encoding" header so caches serve correct variants
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;  # MIME types to compress (text/html is always compressed by default)

    server {
        listen       8080;  # Listen for HTTP connections on port 8080
        server_name  localhost;  # Match requests whose Host header is "localhost"

        root   /usr/share/nginx/html;  # Root directory from which the built static files are served
        index  index.html;  # Default file to serve when a directory is requested

        location / {
            # Single Page App (SPA) fallback
            # Check URI or directory, fall back on index.html for client-side routing.
            # https://nginx.org/en/docs/http/ngx_http_core_module.html#try_files
            try_files $uri $uri/ /index.html;
        }

        location ~* ^\/(?:config\.json|favicon\.svg|assets\/fair-logo\.png)$ {  # Case-insensitive regex match for overridable static files
            # For static files from the public/ folder, which can be overridden using docker bind-mounts,
            # cache-busting by versioned or content-hashed URL is not convenient.
            # To prevent clients from using stale copies of these files, we use "no-cache" to enforce re-validation based on ETag or Last-Modified headers.
            # https://httpwg.org/specs/rfc7234.html#validation.model
            # Note that Nginx automatically generates ETag headers for static files by default.
            # https://nginx.org/en/docs/http/ngx_http_core_module.html#etag
            add_header Cache-Control "no-cache";  # Can be stored in caches, but must be re-validated with server before reuse
            add_header X-Content-Type-Options nosniff;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {  # Case-insensitive regex match for common static asset extensions
            # Static files outside the public/ folder are processed during Vite builds and get a content-hashed filename.
            # As a result, the URL changes whenever the file content changes.
            # This enables cache-busting and allows the resources to be cached as "immutable".
            # https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching#cache_busting
            expires 1y;  # Set the Expires header to 1 year in the future for long-term caching
            access_log off;  # Disable access logging for these static assets
            add_header Cache-Control "public, immutable";  # Tell browsers the resource URL is versioned/content-hashed and won't change during its cache lifetime
            add_header X-Content-Type-Options nosniff;  # Prevent browsers from MIME-sniffing the response type
        }

        location /assets/ {  # Match requests under the /assets/ path (Vite's default build output directory)
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        error_page 404 /index.html;  # On 404 errors, serve index.html to let the SPA router handle the route
    }
}